<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aprovação da arte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Aprovação da arte: a arte em destaque num palco escuro, versão e produto no topo,
   e embaixo aprovar ou pedir ajuste. A cor vem de Sua loja → Cor. */
:root{--cor:#16a34a;--tinta:#0f1f33;--suave:#5b6b7f;--linha:#dfe6ef;--erro:#dc2626}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tinta);background:#fff;min-height:100vh;display:flex;flex-direction:column}
.topo{text-align:center;padding:16px 16px 12px}
.topo h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:color-mix(in srgb,var(--cor) 75%,#0a1a2e)}
.topo .prod{font-size:13px;font-weight:600;margin-top:4px}
.topo .ver{display:inline-flex;gap:8px;align-items:center;margin-top:6px;font-size:13px;color:var(--suave)}
.v{font-weight:800;font-size:12px;color:color-mix(in srgb,var(--cor) 75%,#0a1a2e);background:color-mix(in srgb,var(--cor) 14%,#fff);border-radius:999px;padding:3px 9px}
.palco{background:radial-gradient(ellipse at center,#16233a 0%,#0b1322 55%,#070c16 100%);padding:16px;display:flex;justify-content:center;align-items:center;min-height:min(70vh,640px)}
.palco figure{margin:0;position:relative;max-width:min(100%,560px)}
.palco img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.45);background:#fff}
.palco figcaption{margin-top:10px;text-align:center;font-size:12px;color:rgba(255,255,255,.7)}
.base{max-width:640px;width:100%;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.aviso{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:14px 16px;border:1px solid}
.aviso b{display:block;font-size:15px}
.aviso span{font-size:13.5px;color:var(--suave)}
.aviso.ok{background:#ecfdf3;border-color:#b7ebcb}.aviso.ok b{color:#14532d}
.aviso.aj{background:#fff7ed;border-color:#fed7aa}.aviso.aj b{color:#9a3412}
.aviso.ve{background:#f6f9fc;border-color:var(--linha)}
.bola{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.ok .bola{background:#15803d}.aj .bola{background:#ea580c}.ve .bola{background:var(--suave)}
.nota{font-size:13.5px;background:#f6f9fc;border:1px solid var(--linha);border-radius:10px;padding:10px 12px}
.nota b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);display:block;margin-bottom:2px}
.acoes{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 200px;font:700 15px Inter,sans-serif;border-radius:10px;padding:14px 18px;border:1px solid var(--linha);background:#fff;color:var(--tinta);cursor:pointer;text-decoration:none;text-align:center}
.btn.pri{background:linear-gradient(135deg,var(--cor),color-mix(in srgb,var(--cor) 70%,#0a1a2e));border-color:transparent;color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--cor) 35%,transparent)}
.btn:disabled{opacity:.6;cursor:default}
textarea{width:100%;font:14px Inter,sans-serif;border:1px solid var(--linha);border-radius:8px;padding:10px;resize:vertical;margin:6px 0 10px}
label{font-weight:600;font-size:14px}
.msg{font-size:13px;color:var(--erro);min-height:1em}
.hist{font-size:12.5px;color:var(--suave);text-align:center}
.rod{display:flex;justify-content:center;gap:14px;font-size:13px}
.rod a{color:color-mix(in srgb,var(--cor) 75%,#0a1a2e);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:40}
.vazio{max-width:520px;margin:15vh auto;text-align:center;padding:0 16px}
</style>
</head>
<body>
<main id="ap" style="display:contents"><div class="vazio">Carregando a arte…</div></main>
<div class="toast" id="toast" hidden></div>
<script src="/aprovacao.js"></script>
</body>
</html>
