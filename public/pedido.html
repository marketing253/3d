<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex">
<title>Seu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Passo a passo do pedido para o cliente. A cor vem de Sua loja → Cor da proposta. */
:root{--cor:#12977A;--tinta:#0f1f33;--suave:#5b6b7f;--linha:#e3e9f0;--claro:#f6f9fc;--erro:#dc2626}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;min-height:100vh;font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tinta);
  background:linear-gradient(160deg,color-mix(in srgb,var(--cor) 10%,#eef3f9),#f3f6fa 50%);padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.doc{max-width:560px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(15,31,51,.10);overflow:hidden;display:flex;flex-direction:column;gap:16px;padding-bottom:18px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px;color:#fff;
  background:radial-gradient(circle at 90% 0%,color-mix(in srgb,var(--cor) 38%,transparent),transparent 55%),#0e1114}
.logo img{max-height:46px;max-width:180px;object-fit:contain;display:block}
.logo .nome{font:800 22px/1.1 Inter,sans-serif}
.num{text-align:right}
.num small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cor)}
.num b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.num span{font-size:12.5px;color:#b7bcc4}
.doc > .aviso{margin:0 18px}
/* passos */
.passo{list-style:none;margin:0;padding:0 18px;display:flex;flex-direction:column;gap:10px}
.passo li{border:1px solid var(--linha);border-radius:12px;background:#fff}
.passo .cab{display:flex;gap:12px;align-items:center;padding:12px 14px}
.passo .cab b{display:block;font-size:15px}
.passo .cab small{display:block;color:var(--suave);font-size:12.5px}
.passo .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--claro);color:var(--suave);border:1px solid var(--linha)}
.passo .feito .n{background:var(--cor);border-color:var(--cor);color:#fff}
.passo .feito{background:var(--claro)}
.passo .depois{opacity:.55}
.passo .agora{border:2px solid var(--cor);box-shadow:0 8px 24px color-mix(in srgb,var(--cor) 18%,transparent)}
.passo .agora .n{background:var(--cor);border-color:var(--cor);color:#fff}
.corpo{padding:2px 14px 16px;display:flex;flex-direction:column;gap:12px}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--linha)}
.lista li span{min-width:0}
.lista li{align-items:center}
.lista .txt{flex:1}
.lista li:has(.fotobig){flex-wrap:wrap}
.fotobig{flex:1 1 100%;display:block;position:relative;padding:0;border:1px solid var(--linha);border-radius:12px;overflow:hidden;background:#fff;cursor:zoom-in;margin-bottom:6px}
.fotobig img{display:block;width:100%;height:min(62vw,340px);object-fit:contain}
.fotobig span{position:absolute;right:8px;bottom:8px;background:rgba(14,17,20,.72);color:#fff;font:600 11.5px Inter,sans-serif;padding:4px 9px;border-radius:999px}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(10,14,18,.92);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
.lista small{display:block;color:var(--suave);font-size:13px}
.tag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;color:color-mix(in srgb,var(--cor) 70%,#0a1a2e);background:color-mix(in srgb,var(--cor) 12%,#fff);border-radius:5px;padding:1px 6px;vertical-align:2px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.tot b{font-size:24px}
.exp{margin:0;color:var(--suave);font-size:14px}
.valor{font-size:30px;font-weight:800;color:color-mix(in srgb,var(--cor) 70%,#0a1a2e);line-height:1.1}
.pixw{display:flex;flex-direction:column;gap:10px}
.pixw .btn,.corpo>.btn{flex:none} /* na coluna, o flex-basis de 160px viraria altura */
.ok-pag{position:fixed;inset:0;z-index:60;background:rgba(8,12,16,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.ok-box{background:#fff;border-radius:18px;padding:28px 24px 22px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:okEntra .25s ease-out}
.ok-ic{width:64px;height:64px;border-radius:50%;background:var(--cor);color:#fff;font-size:34px;font-weight:800;display:grid;place-items:center;box-shadow:0 10px 24px color-mix(in srgb,var(--cor) 40%,transparent)}
.ok-box h2{margin:4px 0 0;font-size:22px}
.ok-box p{margin:0;color:var(--suave);font-size:15px}
.ok-box .ok-prox{color:var(--tinta);font-weight:600}
.ok-box .btn{align-self:stretch;margin-top:6px;flex:none}
@keyframes okEntra{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ok-box{animation:none}}
[data-forma].fecha{position:absolute;left:-10000px;top:0;width:min(560px,90vw);opacity:0;pointer-events:none} /* cartão montado e escondido até o clique */
/* fotos do orçamento: carrossel, uma foto por vez; arrasta para o lado e toque amplia */
.carrossel{position:relative;border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--linha)}
.trilho{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trilho::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:0;border:0;background:#fff;cursor:zoom-in;aspect-ratio:4/3}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--tinta);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.18);display:grid;place-items:center;padding-bottom:3px}
.seta.esq{left:10px}.seta.dir{right:10px}
.seta[disabled]{opacity:0;pointer-events:none}
.cont{position:absolute;top:10px;right:10px;background:rgba(14,17,20,.72);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.pontos{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.pontos span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:width .2s}
.pontos span.on{width:20px;border-radius:4px;background:#fff}
@media (hover:none){.seta{display:none}}
/* contador do código Pix e selo de compra segura */
.tempo{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff7e6;border:1px solid #f5d48a;color:#8a5a00;border-radius:10px;padding:8px 12px;font-size:13.5px}
.tempo b{font:800 18px ui-monospace,Consolas,monospace;letter-spacing:.04em}
.tempo.fim{background:#fdecea;border-color:#f3b4ad;color:#b42318}
.seguro{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:10px;background:#ecfdf3;border:1px solid #b7ebcb}
.seguro svg{width:22px;height:22px;flex:none;fill:none;stroke:#12977A;stroke-width:2;margin-top:1px}
.seguro b{display:block;color:#0b6b54;font-size:14px}
.seguro span{color:#3c5a50;font-size:12.5px}
.rec{font-style:normal;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--cor);color:#fff;border-radius:999px;padding:2px 8px;margin-left:4px;vertical-align:2px}
.formas{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--claro);border:1px solid var(--linha);border-radius:12px;padding:4px}
.fm{font:700 14px Inter,sans-serif;border:0;border-radius:9px;padding:10px 8px;background:transparent;color:var(--suave);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.fm small{font-weight:500;font-size:11.5px}
.fm.on{background:#fff;color:var(--tinta);box-shadow:0 1px 4px rgba(10,20,30,.12)}
#cardBrick{min-height:60px}
.opcoes{display:flex;flex-direction:column;gap:8px}
.opc{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--linha);border-radius:10px;padding:12px;cursor:pointer;background:#fff}
.opc:has(input:checked){border:2px solid var(--cor);padding:11px;background:color-mix(in srgb,var(--cor) 6%,#fff)}
.opc input{accent-color:var(--cor);width:18px;height:18px;margin:1px 0 0;flex:none}
.opc b{display:block;font-size:15px}
.opc small{display:block;color:var(--suave);font-size:13px}
.qr{align-self:center;background:#fff;padding:10px;border:1px solid var(--linha);border-radius:12px}
.qr svg{width:200px;height:200px;display:block}
.cod{font:12px ui-monospace,Consolas,monospace;word-break:break-all;background:var(--claro);border:1px solid var(--linha);border-radius:8px;padding:10px;max-height:80px;overflow:auto;user-select:all}
.chave{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px dashed var(--linha);border-radius:10px;padding:10px 12px}
.chave span{font-size:12px;color:var(--suave);display:block}
.chave b{word-break:break-all;font-size:14px}
.aviso{display:flex;flex-direction:column;gap:2px;background:var(--claro);border:1px solid var(--linha);border-radius:10px;padding:12px 14px}
.aviso span{color:var(--suave);font-size:14px}
.aviso.ok{background:#ecfdf3;border-color:#b7ebcb}
.arte{margin:0;background:radial-gradient(ellipse at center,#16233a,#070c16);border-radius:12px;padding:12px}
.arte img{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:4px;background:#fff}
.arte figcaption{margin-top:8px;text-align:center;font-size:12px;color:rgba(255,255,255,.7)}
.acoes{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 160px;font:700 15px Inter,sans-serif;border-radius:10px;padding:13px 18px;border:1px solid var(--linha);background:#fff;color:var(--tinta);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.pri{background:var(--cor);border-color:transparent;color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--cor) 30%,transparent)}
.btn.perigo{color:var(--erro);border-color:color-mix(in srgb,var(--erro) 40%,#fff)}
.btn.sm{flex:none;padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
label{font-weight:600;font-size:14px}
textarea{width:100%;font:14px Inter,sans-serif;border:1px solid var(--linha);border-radius:8px;padding:10px;resize:vertical;margin:6px 0 10px}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);margin:0 18px;border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.resumo div{padding:10px 12px;display:flex;flex-direction:column;background:var(--claro)}
.resumo div+div{border-left:1px solid var(--linha)}
.resumo span{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--suave)}
.resumo b{font-size:15px}
.rodape{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;font-size:12.5px;color:var(--suave);padding:0 18px}
.rodape a{color:color-mix(in srgb,var(--cor) 70%,#0a1a2e);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:40}
.vazio{max-width:480px;margin:15vh auto;text-align:center;background:#fff;border-radius:14px;padding:28px 20px}
@media (max-width:480px){body{padding:8px 8px 28px}.passo,.resumo{margin-left:0;margin-right:0}.passo{padding:0 12px}.resumo{margin:0 12px}.doc > .aviso{margin:0 12px}}
</style>
<link rel="preconnect" href="https://sdk.mercadopago.com"><link rel="preconnect" href="https://api.mercadopago.com"><link rel="preconnect" href="https://http2.mlstatic.com" crossorigin>
</head>
<body>
<main id="ped"><div class="vazio">Carregando seu pedido…</div></main>
<div class="toast" id="toast" hidden></div>
<script src="/pedido.js"></script>
</body>
</html>
