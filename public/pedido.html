<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Seu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
body{padding-block:0 40px}
.ped{max-width:620px;margin:0 auto;padding:28px 16px;display:flex;flex-direction:column;gap:16px}
.ped h1{font-size:clamp(26px,6vw,36px)}
.passos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.passos div{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.passos i{height:6px;border-radius:3px;background:var(--sunken)}
.passos .on{color:var(--accent);font-weight:600}.passos .on i{background:var(--accent)}
.it{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .ph{width:64px;height:64px;border-radius:8px;background:var(--sunken);display:grid;place-items:center;color:var(--muted);font:600 11px var(--mono);overflow:hidden}
.it .ph img{width:100%;height:100%;object-fit:cover}
.it b{display:block}
.lin{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:3px 0}
.lin.tot{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.lin.falta{font-size:20px;font-weight:800;color:var(--accent)}
.pixw{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pixw .qr{background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line)}
.pixw .qr svg{width:180px;height:180px;display:block}
.pixw .cod{flex:1 1 220px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pixw textarea{font:12px var(--mono);word-break:break-all;resize:none}
.cta{display:flex;flex-direction:column;gap:8px}
.cta .btn{justify-content:center;padding:13px 16px;font-size:15px}
.ped > header{padding:24px;border-radius:18px;color:#fff;background:radial-gradient(circle at 85% 15%,rgba(74,222,128,.4),transparent 45%),linear-gradient(135deg,#0d3a24,#14532d 60%,#166534);box-shadow:var(--shadow-lg)}
.ped > header h1{color:#fff}.ped > header h1 small{color:#86efac}.ped > header p{color:#e3f3ea}.ped > header .note{color:#bfe3cd}.ped > header b{color:#fff}
.it .ph{background:linear-gradient(135deg,var(--sunken),var(--accent-soft));color:var(--accent-strong);font-family:var(--body);font-weight:800}
.lin.falta{color:var(--accent-strong)}
.cta .btn{border-radius:999px}
.resp{border:2px solid var(--accent)}
.chave{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.chave b{font-size:15px;min-width:0}
</style>
</head>
<body>
<main class="ped" id="ped"><p class="note">Carregando seu pedido…</p></main>
<div class="toast" id="toast" hidden></div>
<script src="/pedido.js"></script>
</body>
</html>
