<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo</title>
<meta name="description" content="Peças impressas em 3D sob encomenda e à pronta entrega.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
body{padding-block:0 120px}
.hero{padding-block:36px 18px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(30px,6vw,46px)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:16px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.prod .ph{aspect-ratio:1/1;background:var(--sunken);display:grid;place-items:center;color:var(--muted);font:600 13px var(--mono);max-width:100%}
.prod .ph img{width:100%;height:100%;object-fit:cover;display:block}
.prod .bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod h2{font-size:17px}
.prod p{margin:0;font-size:13.5px;color:var(--muted)}
.prod .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}
.prod .preco{font-family:var(--display);font-weight:800;font-size:22px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.step button{border:0;background:var(--surface);color:var(--ink);width:34px;height:34px;font-size:18px;cursor:pointer}
.step span{min-width:30px;text-align:center;font:600 14px var(--mono)}
.cartbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);z-index:10}
.cartbar .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.cart{max-width:1180px;margin:0 auto 10px;display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cline input{grid-column:1/-1;font-size:14px;padding:6px 8px}
.cliente{max-width:1180px;margin:0 auto 10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.cliente input{font-size:15px}
.prod .de{text-decoration:line-through;color:var(--muted);font-size:13px;font-family:var(--mono)}
.prod .eco{font:600 11.5px var(--mono);color:var(--accent)}
.foot{margin-top:40px;color:var(--muted);font-size:13px}
/* tema moderno do catálogo */
body{background:var(--bg)}
.hero{margin:16px 0 4px;padding:34px 28px;border-radius:20px;color:#fff;background:radial-gradient(circle at 85% 15%,rgba(74,222,128,.4),transparent 45%),linear-gradient(135deg,#0d3a24,#14532d 60%,#166534);box-shadow:var(--shadow-lg)}
.hero h1{color:#fff;font-size:clamp(30px,6vw,44px)}
.hero h1 small{color:#86efac}
.hero p{color:#cfe9d9}
.hero .pill{background:rgba(255,255,255,.12);color:#fff}
.hero .pill.acc{background:#22c55e;color:#04170c;text-decoration:none}
.chips{margin-top:18px}
.cat-grid{gap:18px}
.prod{transition:transform .18s,box-shadow .18s;border:0}
.prod:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.prod .ph{background:linear-gradient(135deg,var(--sunken),var(--accent-soft));font:800 18px var(--body);color:var(--accent-strong);letter-spacing:.05em}
.prod h2{font-size:16.5px;font-weight:700}
.prod .preco{font:800 22px var(--body);letter-spacing:-.02em;color:var(--ink)}
.prod .btn.primary{border-radius:999px;padding:9px 18px}
.step{border-radius:999px;border-color:var(--line-strong)}
.step button{font-weight:700}
.cartbar{border-top:0;box-shadow:0 -10px 30px rgba(16,40,28,.12);border-radius:20px 20px 0 0;padding-top:16px}
.cartbar .btn.primary{border-radius:999px;padding:11px 20px}
#kits h2{font-size:20px}
.prod .eco,.prod .de{font-family:var(--body)}
@media (max-width:560px){
  .cat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .prod .bd{padding:11px;gap:4px}
  .prod h2{font-size:14.5px}
  .prod p{font-size:12.5px}
  .prod .ft{flex-direction:column;align-items:stretch;gap:8px}
  .prod .preco{font-size:19px}
  .prod .btn.primary{padding:8px 10px;font-size:13px}
  .step{justify-content:space-between}
  .hero{padding:24px 20px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1 id="lojaNome"><small>Impressão 3D sob encomenda</small>Catálogo</h1>
    <p id="lojaSobre"></p>
    <div class="meta" id="lojaMeta"></div>
  </header>
  <section id="kits" hidden><h2 style="margin:18px 0 0">Kits e combos</h2><div class="cat-grid" id="kitGrid"></div><h2 style="margin:26px 0 0">Produtos</h2></section>
  <div class="row chips" id="cats"></div>
  <main class="cat-grid" id="grid"><p class="note">Carregando produtos…</p></main>
  <p class="foot">Os preços são por unidade. Peças personalizadas são confirmadas pelo WhatsApp antes da produção.</p>
</div>

<div class="cartbar" id="cartbar" hidden>
  <div class="cart" id="cart" hidden></div>
  <div class="cliente" id="cliente" hidden>
    <label class="f">Seu nome<input id="cNome" maxlength="80" autocomplete="name" placeholder="Nome e sobrenome"></label>
    <label class="f">Seu WhatsApp<input id="cWhats" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678"></label>
    <div class="f" id="cupBox" hidden><span>Cupom de desconto</span><div class="row" style="gap:6px;flex-wrap:nowrap"><input id="cCupom" maxlength="30" autocapitalize="characters" placeholder="Código"><button class="btn" id="cAplicar" type="button">Aplicar</button></div><span class="note" id="cupMsg" style="margin:0"></span></div>
  </div>
  <div class="in">
    <button class="btn" id="verCarrinho" type="button">Ver pedido</button>
    <span id="cartResumo" class="num"></span>
    <a class="btn primary" id="enviar" target="_blank" rel="noopener" href="#">Enviar pedido pelo WhatsApp</a>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/catalogo.js"></script>
</body>
</html>
