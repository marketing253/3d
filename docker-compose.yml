services:
  precificador:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"   # só o nginx da VPS acessa
    volumes:
      - ./data:/app/data        # banco e fotos ficam fora do container
